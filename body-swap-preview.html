<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>몸통 규칙 비교</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      body { margin: 0; background: #fff4f7; color: #4a3d33; font-family: 'Pretendard Variable', sans-serif; }
      main { padding: 16px; max-width: 1400px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 18px 0 6px; display: flex; align-items: center; gap: 6px; }
      .hint { font-size: 12px; color: #8a7a6c; margin: 0 0 8px; }
      .chip { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #0002; }
      section { background: #fff8; border-radius: 14px; padding: 4px 10px 8px; margin-bottom: 8px; }
      .row { display: grid; grid-template-columns: 150px repeat(12, 1fr); gap: 4px; align-items: center; margin-bottom: 4px; }
      .label b { font-size: 13px; display: block; }
      small { display: block; font-size: 10.5px; color: #8a7a6c; }
      figure { margin: 0; text-align: center; }
      figure img { width: 100%; aspect-ratio: 392/400; background: #fff; border-radius: 10px; display: block; }
      figcaption { font-size: 10.5px; }
    </style>
  </head>
  <body><main id="root"></main><script type="module" src="/src/mapping/bodySwapPreview.tsx"></script></body>
</html>
