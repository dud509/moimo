<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>집안 표식</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      body { margin: 0; background: #fff4f7; color: #4a3d33; font-family: 'Pretendard Variable', sans-serif; }
      main { padding: 16px; max-width: 1400px; margin: 0 auto; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .hint { font-size: 12px; color: #8a7a6c; margin: 0 0 10px; }
      .fams { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 8px; }
      section { background: #fff8; border-radius: 14px; padding: 6px 10px 8px; }
      h2 { font-size: 13px; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
      h2 b { font-size: 16px; }
      h2 small { margin-left: auto; color: #8a7a6c; }
      .chip { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid #0002; }
      .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
      .row img { width: 100%; aspect-ratio: 392/400; background: #fff; border-radius: 10px; display: block; }
    </style>
  </head>
  <body><main id="root"></main><script type="module" src="/src/mapping/familyPreview.tsx"></script></body>
</html>
