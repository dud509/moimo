<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>모이모 이름 고르기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      body { margin: 0; background: #fffdf8; color: #4a3d33; font-family: 'Pretendard Variable', sans-serif; }
      header { position: sticky; top: 0; z-index: 2; background: #fffdf8ee; backdrop-filter: blur(6px); padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #eee4da; }
      header b { font-size: 17px; }
      header button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid #ddd2c6; background: #fff; cursor: pointer; }
      header button.on { background: #4a3d33; color: #fff; border-color: #4a3d33; }
      header .picked { font-size: 13px; color: #8a7a6c; }
      main { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; padding: 12px 16px 40px; }
      figure { margin: 0; text-align: center; cursor: pointer; border-radius: 12px; padding: 4px; border: 2px solid transparent; }
      figure.on { border-color: #e59aae; background: #fff4f7; }
      figure img { width: 100%; aspect-ratio: 392/400; background: #fff; border-radius: 10px; display: block; }
      figcaption { font-size: 13px; font-weight: 700; margin-top: 3px; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/src/mapping/namesPreview.tsx"></script></body>
</html>
